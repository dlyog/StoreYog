name: Judge setup and core checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python setup.py --demo --non-interactive --test
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:oauth
      - run: npm run test:oauth-proxy
      - run: npm run test:owner
      - run: npm run test:admin
